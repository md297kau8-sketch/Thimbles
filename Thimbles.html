,<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cyber Thimbles - FD44 Sync Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase App SDK & Realtime Database SDK (Matching Platform) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark-purple: #13042c;
      --bg-neon-purple: #2a085c;
      --table-top: #25164c;
      --table-rim: #6b21a8;
      --btn-green-top: #4ade80;
      --btn-green-mid: #22c55e;
      --btn-green-shadow: #15803d;
      --font-fun: 'Fredoka', cursive, sans-serif;
      --font-body: 'Quicksand', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #090014;
      font-family: var(--font-fun);
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-screen {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 920px;
      background: radial-gradient(circle at 50% 30%, #4c1d95 0%, #1e0549 60%, #0c001f 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.35);
    }

    @media (min-width: 480px) {
      .game-screen {
        height: 95vh;
        border-radius: 36px;
        border: 2px solid rgba(168, 85, 247, 0.3);
      }
    }

    .environment-skyline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .spotlight {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(192, 132, 252, 0.22) 0%, rgba(147, 51, 234, 0) 70%);
      filter: blur(16px);
    }

    .city-silhouette {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      height: 140px;
      background: 
        linear-gradient(to top, rgba(20, 3, 50, 0.95), transparent 90%),
        repeating-linear-gradient(90deg, #1b073b 0px, #1b073b 28px, transparent 28px, transparent 38px, #160431 38px, #160431 80px);
      opacity: 0.85;
      filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.3));
    }

    .top-nav {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
    }

    .hud-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.1s;
    }

    .hud-btn:active { transform: scale(0.92); }

    .virtual-wallet {
      background: rgba(18, 5, 41, 0.85);
      border: 2px solid #581c87;
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 3px 4px 3px 12px;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .wallet-val {
      font-size: 14px;
      font-weight: 800;
      color: #ffd700;
    }

    .wallet-unit {
      color: #ec4899;
      font-size: 11px;
    }

    .wallet-add {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(180deg, #facc15, #d97706);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .stats-tracker {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: -4px;
    }

    .stat-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-win { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }
    .stat-loss { color: #f43f5e; border-color: rgba(244, 63, 94, 0.4); }

    .title-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-top: 2px;
    }

    .game-logo {
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      text-shadow: 0 2px 0 #7e22ce, 0 4px 0 #581c87, 0 0 20px #c084fc;
      letter-spacing: 1.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .logo-mini-cup {
      width: 18px;
      height: 20px;
      background: linear-gradient(135deg, #fde047, #d97706);
      border-radius: 35% 35% 10% 10%;
      border: 1.5px solid #fff;
    }

    .banner-container {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      margin-top: 4px;
    }

    .banner-instruction {
      flex: 1;
      height: 42px;
      background: linear-gradient(180deg, #fef9c3 0%, #fef08a 50%, #fde047 100%);
      border: 2px solid #ca8a04;
      border-radius: 12px;
      box-shadow: 0 4px 0 #854d0e, 0 6px 12px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #1e1b4b;
    }

    .side-square-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .help-btn {
      background: linear-gradient(180deg, #fb923c, #ea580c);
      box-shadow: 0 4px 0 #9a3412;
      border: 1.5px solid #ffedd5;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .sound-btn {
      background: linear-gradient(180deg, #94a3b8, #475569);
      box-shadow: 0 4px 0 #1e293b;
      border: 1.5px solid #e2e8f0;
      color: #fff;
    }

    .stage-section {
      position: relative;
      height: 300px;
      margin: 8px 10px 0 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 5;
    }

    .table-perspective-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 180px;
      pointer-events: none;
    }

    .table-surface-top {
      position: absolute;
      bottom: 42px;
      left: 3%;
      width: 94%;
      height: 82px;
      background: linear-gradient(180deg, #2b1754 0%, #1a0b38 100%);
      border-radius: 20px 20px 14px 14px;
      border: 2px solid #9333ea;
      transform: perspective(400px) rotateX(25deg);
      box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.4);
      z-index: 1;
    }

    .table-rim-front {
      position: absolute;
      bottom: 14px;
      left: 3%;
      width: 94%;
      height: 34px;
      background: linear-gradient(180deg, #180833 0%, #0c021c 100%);
      border-radius: 0 0 16px 16px;
      border-bottom: 3px solid #581c87;
      box-shadow: 0 18px 25px rgba(0, 0, 0, 0.8);
      z-index: 2;
    }

    .table-rim-glow {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c084fc, transparent);
    }

    .cups-container {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100%;
      height: 180px;
      z-index: 10;
      pointer-events: none;
    }

    .thimble-shell {
      position: absolute;
      bottom: 12px;
      width: 92px;
      height: 128px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .cup-contact-shadow {
      position: absolute;
      bottom: -12px;
      left: 5%;
      width: 90%;
      height: 24px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
      transition: opacity 0.2s, transform 0.2s;
    }

    .cup-vector-body {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(105deg, 
        #fef9c3 0%, 
        #facc15 15%, 
        #b45309 42%, 
        #78350f 68%, 
        #f59e0b 84%, 
        #fffbeb 100%
      );
      border-radius: 46% 46% 12% 12% / 65% 65% 8% 8%;
      box-shadow: 
        inset 0 4px 8px rgba(255, 255, 255, 0.9),
        inset 0 -8px 14px rgba(0,0,0,0.7),
        0 16px 20px rgba(0,0,0,0.6);
      border: 1.8px solid #fde047;
      overflow: hidden;
    }

    .cup-vector-body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      width: 22%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
      transform: skewX(-7deg);
      filter: blur(1px);
    }

    .cup-vector-body::after {
      content: '';
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(120, 53, 15, 0.5);
      box-shadow: 0 2px 4px rgba(254, 240, 138, 0.5);
    }

    .cup-base-lip {
      position: absolute;
      bottom: 3px;
      left: 3%;
      width: 94%;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fef08a 0%, #d97706 70%, #78350f 100%);
      box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.8);
      border: 1.2px solid rgba(254, 240, 138, 0.8);
    }

    .hidden-sphere {
      position: absolute;
      bottom: 22px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #a5f3fc 35%, #0284c7 80%, #0369a1 100%);
      box-shadow: 0 0 16px #38bdf8, 0 0 28px rgba(56, 189, 248, 0.85);
      z-index: 5;
      display: none;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .modes-deck {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 12px;
      padding: 0 16px;
      margin: 6px 0 10px 0;
    }

    .mode-pill {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: 2px solid;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .mode-pill.green-theme {
      background: linear-gradient(180deg, #4ade80 0%, #22c55e 60%, #16a34a 100%);
      border-color: #86efac;
      box-shadow: 0 4px 0 #14532d;
    }

    .mode-pill.blue-theme {
      background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 60%, #0284c7 100%);
      border-color: #7dd3fc;
      box-shadow: 0 4px 0 #075985;
    }

    .mode-pill:not(.active) {
      filter: grayscale(0.55) brightness(0.7);
      opacity: 0.8;
      box-shadow: none;
    }

    .bottom-console {
      position: relative;
      z-index: 10;
      background: linear-gradient(180deg, #170736 0%, #0a011a 100%);
      border-top: 2px solid #581c87;
      padding: 12px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stake-control-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .stake-input-card {
      flex: 1;
      background: #12052c;
      border: 2px solid #7e22ce;
      border-radius: 16px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
    }

    .stake-top-hint {
      font-size: 10px;
      color: #c084fc;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
    }

    .custom-stake-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fde047;
      font-family: var(--font-fun);
      font-size: 20px;
      font-weight: 800;
      outline: none;
      margin-top: 2px;
    }

    .play-giant-btn {
      width: 110px;
      height: 68px;
      background: linear-gradient(180deg, #86efac 0%, #22c55e 50%, #15803d 100%);
      border: 2.5px solid #bbf7d0;
      border-radius: 20px;
      box-shadow: 0 5px 0 #14532d, 0 10px 20px rgba(34, 197, 94, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-giant-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #14532d;
    }

    .play-giant-btn:disabled {
      background: linear-gradient(180deg, #64748b 0%, #334155 100%);
      border-color: #94a3b8;
      box-shadow: 0 3px 0 #1e293b;
      cursor: not-allowed;
      filter: grayscale(0.85);
    }

    .play-triangle-glyph {
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 24px solid #ffffff;
      margin-left: 4px;
    }

    .toast-pill {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
    }
    .toast-pill.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="game-screen">
    
    <div class="environment-skyline">

    <div class="toast-pill" id="game-toast">ব্যালেন্স আপডেট হয়েছে!</div>

  <script>
    /* ==========================================================
       1. MATCHING FIREBASE REALTIME DATABASE INITIALIZATION
       ========================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyAzG6l80RC_DnwKk7KlvVod2YU8GIC2oio",
      authDomain: "nskk-2ca2d.firebaseapp.com",
      databaseURL: "https://nskk-2ca2d-default-rtdb.firebaseio.com",
      projectId: "nskk-2ca2d",
      storageBucket: "nskk-2ca2d.firebasestorage.app",
      messagingSenderId: "629774743594",
      appId: "1:629774743594:web:a1610ad2d204eb791deb53",
      measurementId: "G-YDXWDVFPZ3"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    let activePhone = null;

    /**
     * Web Audio Engine
     */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.12) {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(gainVal, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }
      slideSound() { this.playTone(280, 'triangle', 0.12, 0.08); }
      liftSound() { this.playTone(180, 'sine', 0.15, 0.15); }
      winChime() {
        if (this.muted) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'square', 0.18, 0.09), idx * 75);
        });
      }
      missSound() { this.playTone(160, 'sawtooth', 0.28, 0.12); }
    }

    const sound = new AudioEngine();

    const states = { IDLE: 0, REVEAL: 1, SHUFFLE: 2, PICK: 3, RESULT: 4 };
    let currentState = states.IDLE;
    
    let balance = 0.00;
    let activeMode = 1;

    let winCount = 0;
    let lossCount = 0;

    const cups = [
      document.getElementById('cup-0'),
      document.getElementById('cup-1'),
      document.getElementById('cup-2')
    ];
    const balls = [
      document.getElementById('ball-0'),
      document.getElementById('ball-1'),
      document.getElementById('ball-2')
    ];

    let cupSlotMap = [0, 1, 2];
    let ballPresence = [false, false, false];

    function computeSlotX() {
      const arena = document.getElementById('arena-box');
      const arenaWidth = arena.clientWidth;
      const cupWidth = 92;
      const sideMargin = 20;
      const availableSpace = arenaWidth - (sideMargin * 2) - cupWidth;
      const step = availableSpace / 2;
      return [
        sideMargin,
        sideMargin + step,
        sideMargin + (step * 2)
      ];
    }

    function positionCups() {
      const slots = computeSlotX();
      cupSlotMap.forEach((cupId, slotIdx) => {
        const el = cups[cupId];
        el.style.transform = `translateX(${slots[slotIdx]}px)`;
      });
    }

    window.addEventListener('resize', positionCups);
    positionCups();

    const balanceDisplay = document.getElementById('val-balance');
    const statusLabel = document.getElementById('lbl-status');
    const playBtn = document.getElementById('btn-main-play');
    const toast = document.getElementById('game-toast');
    const customBetInput = document.getElementById('input-custom-bet');
    const winDisplay = document.getElementById('lbl-win-count');
    const lossDisplay = document.getElementById('lbl-loss-count');

    /* 🚀 ১০০% লাইভ ব্যালেন্স সিঙ্ক (FD44 প্ল্যাটফর্মের সাথে ডিরেক্ট লিংক) */
    function initUserDatabaseSync() {
      const urlParams = new URLSearchParams(window.location.search);
      let phoneFound = urlParams.get('phone') || urlParams.get('user') || urlParams.get('uid');

      if (!phoneFound) {
        try {
          if (window.parent && window.parent.user && window.parent.user.phone) {
            phoneFound = window.parent.user.phone;
          }
        } catch(e) {}
      }

      if (!phoneFound) {
        try {
          phoneFound = localStorage.getItem('bd99_user');
        } catch(e) {}
      }

      if (phoneFound) {
        bindUserAccount(phoneFound);
      } else {
        database.ref('users').limitToLast(1).once('value', (snap) => {
          if (snap.exists()) {
            const data = snap.val();
            const lastPhone = Object.keys(data)[0];
            if (lastPhone) bindUserAccount(lastPhone);
          }
        });
      }
    }

    function bindUserAccount(phone) {
      activePhone = phone;
      try { localStorage.setItem('bd99_user', phone); } catch(e) {}

      database.ref('users/' + phone + '/balance').on('value', (snapshot) => {
        if (snapshot.exists() && snapshot.val() !== null) {
          balance = parseFloat(snapshot.val()) || 0;
          updateBalance();

          try {
            if (window.parent && window.parent.document) {
              window.parent.document.querySelectorAll('.userBalance').forEach(e => {
                e.innerText = balance.toFixed(2);
              });
            }
          } catch(e) {}
        }
      });
    }

    function deductRealBalance(amount) {
      balance = parseFloat((balance - amount).toFixed(2));
      updateBalance();

      if (activePhone) {
        database.ref('users/' + activePhone + '/balance').transaction((curr) => {
          let val = parseFloat(curr);
          if (isNaN(val)) return 0;
          return Math.max(0, parseFloat((val - amount).toFixed(2)));
        });

        database.ref('users/' + activePhone + '/wager_left').transaction((curr) => {
          let left = parseFloat(curr || 0) - amount;
          return left < 0 ? 0 : parseFloat(left.toFixed(2));
        });
      }

      try {
        if (window.parent && window.parent.document) {
          window.parent.document.querySelectorAll('.userBalance').forEach(e => {
            e.innerText = balance.toFixed(2);
          });
        }
      } catch(e) {}
    }

    function addRealBalance(amount) {
      if (amount <= 0) return;
      balance = parseFloat((balance + amount).toFixed(2));
      updateBalance();

      if (activePhone) {
        database.ref('users/' + activePhone + '/balance').transaction((curr) => {
          let val = parseFloat(curr || 0);
          return parseFloat((val + amount).toFixed(2));
        });
      }

      try {
        if (window.parent && window.parent.document) {
          window.parent.document.querySelectorAll('.userBalance').forEach(e => {
            e.innerText = balance.toFixed(2);
          });
        }
      } catch(e) {}
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
      winCount = 0;
      lossCount = 0;
      winDisplay.innerText = winCount;
      lossDisplay.innerText = lossCount;
      sound.playTone(300, 'sine', 0.05);
    });

    document.querySelectorAll('.mode-pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        if (currentState !== states.IDLE) return;
        document.querySelectorAll('.mode-pill').forEach(p => p.classList.remove('active'));
        const target = e.currentTarget;
        target.classList.add('active');
        activeMode = parseInt(target.dataset.mode);
        sound.playTone(550, 'sine', 0.05);
      });
    });

    const toggleSound = () => {
      sound.muted = !sound.muted;
      const op = sound.muted ? '0.35' : '1';
      document.getElementById('btn-sound').style.opacity = op;
      document.getElementById('btn-fast-mute').style.opacity = op;
    };
    document.getElementById('btn-sound').addEventListener('click', toggleSound);
    document.getElementById('btn-fast-mute').addEventListener('click', toggleSound);

    document.getElementById('btn-rules').addEventListener('click', () => {
      alert("Cyber Thimbles:\n\n• মিনিমাম বেট: ৫ ৳\n• ম্যাক্সিমাম বেট: ৫০,০০০ ৳\n• FD44 প্ল্যাটফর্মের ব্যালেন্স দিয়ে সরাসরি খেলতে পারবেন।\n• কাপগুলো লক্ষ্য করুন এবং সঠিক কাপটি বেছে নিন!");
    });

    function updateBalance() {
      balanceDisplay.innerHTML = `${balance.toFixed(2)} <span class="wallet-unit">৳</span>`;
    }

    // MAIN GAMEPLAY
    playBtn.addEventListener('click', startRound);

    async function startRound() {
      let bet = parseInt(customBetInput.value);

      if (isNaN(bet) || bet < 5) {
        alert("মিনিমাম বেট ৫ ৳!");
        customBetInput.value = 5;
        return;
      }
      if (bet > 50000) {
        alert("ম্যাক্সিমাম বেট ৫০,০০০ ৳!");
        customBetInput.value = 50000;
        return;
      }
      if (balance < bet) {
        alert("আপনার ব্যালেন্স অপর্যাপ্ত! দয়া করে আপনার FD44 অ্যাকাউন্টে ডিপোজিট করুন।");
        return;
      }

      // ব্যালেন্স কাটা (FD44 ও Thimbles একসাথে সিঙ্ক হবে)
      deductRealBalance(bet);

      currentState = states.REVEAL;
      playBtn.disabled = true;
      customBetInput.disabled = true;
      statusLabel.innerText = "বলটি লক্ষ্য করুন!";

      ballPresence = [false, false, false];
      if (activeMode === 1) {
        const luckyCup = Math.floor(Math.random() * 3);
        ballPresence[luckyCup] = true;
      } else {
        const emptyCup = Math.floor(Math.random() * 3);
        ballPresence = [true, true, true];
        ballPresence[emptyCup] = false;
      }

      const slots = computeSlotX();

      cupSlotMap.forEach((cupId, slotIdx) => {
        const ball = balls[cupId];
        if (ballPresence[cupId]) {
          ball.style.display = 'block';
          ball.style.left = `${slots[slotIdx] + 46}px`;
        } else {
          ball.style.display = 'none';
        }
      });

      await animateCupsLift(true);
      await new Promise(r => setTimeout(r, 900));
      await animateCupsLift(false);
      await new Promise(r => setTimeout(r, 200));

      balls.forEach(b => b.style.display = 'none');

      await executeShuffle();
    }

    function animateCupsLift(lift = true) {
      return new Promise(resolve => {
        cups.forEach(cup => {
          cup.style.transition = 'transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28)';
          const curX = cup.style.transform.match(/translateX\(([^)]+)\)/)[1];
          cup.style.transform = `translateX(${curX}) translateY(${lift ? '-75px' : '0px'})`;
          
          const shadow = cup.querySelector('.cup-contact-shadow');
          shadow.style.opacity = lift ? '0.2' : '1';
          shadow.style.transform = lift ? 'scale(0.8)' : 'scale(1)';
        });
        sound.liftSound();
        setTimeout(resolve, 360);
      });
    }

    async function executeShuffle() {
      currentState = states.SHUFFLE;
      statusLabel.innerText = "মনোযোগ দিন! কাপগুলো ঘুরছে...";

      const totalSwaps = 13; 
      
      for (let i = 0; i < totalSwaps; i++) {
        let speed = 260;
        if (i > 3 && i < 10) speed = 200;
        if (i >= 10) speed = 240;

        await swapRandomPair(speed);
      }

      currentState = states.PICK;
      statusLabel.innerText = "যেকোনো একটি গ্লাস বাছুন!";
    }

    function swapRandomPair(speed) {
      return new Promise(resolve => {
        let s1 = Math.floor(Math.random() * 3);
        let s2 = Math.floor(Math.random() * 3);
        while (s2 === s1) {
          s2 = Math.floor(Math.random() * 3);
        }

        const cupA = cupSlotMap[s1];
        const cupB = cupSlotMap[s2];

        cupSlotMap[s1] = cupB;
        cupSlotMap[s2] = cupA;

        const slots = computeSlotX();
        const elA = cups[cupA];
        const elB = cups[cupB];

        elA.style.transition = `transform ${speed}ms cubic-bezier(0.4, 0, 0.2, 1)`;
        elB.style.transition = `transform ${speed}ms cubic-bezier(0.4, 0, 0.2, 1)`;

        elA.style.transform = `translateX(${slots[s2]}px)`;
        elB.style.transform = `translateX(${slots[s1]}px)`;

        sound.slideSound();
        setTimeout(resolve, speed + 20);
      });
    }

    cups.forEach((cup, cupId) => {
      cup.addEventListener('click', () => handleCupChoice(cupId));
    });

    async function handleCupChoice(chosenCupId) {
      if (currentState !== states.PICK) return;
      currentState = states.RESULT;

      const isWinner = ballPresence[chosenCupId];
      const multiplier = activeMode === 1 ? 2.91 : 1.45;
      const slots = computeSlotX();
      const bet = parseInt(customBetInput.value);

      cupSlotMap.forEach((cId, sIdx) => {
        if (ballPresence[cId]) {
          const ball = balls[cId];
          ball.style.display = 'block';
          ball.style.left = `${slots[sIdx] + 46}px`;
        }
      });

      await animateCupsLift(true);

      if (isWinner) {
        const prize = Math.floor(bet * multiplier);
        
        // ব্যালেন্স যোগ (জেতা টাকা FD44 ও Thimbles একসাথে বাড়বে)
        addRealBalance(prize);
        
        winCount++;
        winDisplay.innerText = winCount;
        sound.winChime();
        statusLabel.innerText = `অভিনন্দন! জিতেছেন +${prize} ৳`;
      } else {
        lossCount++;
        lossDisplay.innerText = lossCount;
        sound.missSound();
        statusLabel.innerText = "ভুল কাপ! আবার চেষ্টা করুন";
      }

      setTimeout(async () => {
        await animateCupsLift(false);
        balls.forEach(b => b.style.display = 'none');
        currentState = states.IDLE;
        statusLabel.innerText = "Place a bet";
        playBtn.disabled = false;
        customBetInput.disabled = false;
      }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initUserDatabaseSync();
    });
  </script>
</body>
</html>
